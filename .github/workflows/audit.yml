name: Dependency Audit

on:
  push:
    branches: [main, 'feature/**', 'ci/**']

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run npm audit (non-blocking)
        run: |
          set +e
          npm run audit:ci > audit.json
          AUDIT_EXIT=$?
          cat audit.json
          if [ "$AUDIT_EXIT" -ne 0 ]; then
            echo "::warning::npm audit reported vulnerabilities (non-blocking)."
          fi
          exit 0
