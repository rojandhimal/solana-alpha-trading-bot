name: SOL Historical Research

on:
  workflow_dispatch:
  push:
    branches: ['feature/walk-forward-integration']

permissions:
  contents: read

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  REDIS_URL: redis://localhost:6379
  SOLANA_RPC_URL: https://api.mainnet-beta.solana.com
  DEXSCREENER_BASE_URL: https://api.dexscreener.com
  TRADING_MODE: PAPER
  ENABLE_LIVE_TRADING: 'false'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feature/walk-forward-integration
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  gecko-dex-diagnostic:
    needs: validate
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feature/walk-forward-integration
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Run SOL DEX historical experiment
        run: npm run research:solana
        env:
          SOL_EXPERIMENT_OUTPUT: artifacts/solana-historical-experiment.json
      - name: Upload DEX diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solana-geckoterminal-diagnostic
          path: artifacts/solana-historical-experiment.json
          if-no-files-found: ignore

  binance-benchmark:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feature/walk-forward-integration
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Run SOL 2025 Binance benchmark
        run: npm run research:solana:binance
        env:
          SOL_BINANCE_EXPERIMENT_OUTPUT: artifacts/solana-binance-historical-experiment.json
      - name: Upload Binance benchmark
        uses: actions/upload-artifact@v4
        with:
          name: solana-binance-historical-experiment
          path: artifacts/solana-binance-historical-experiment.json
          if-no-files-found: error
