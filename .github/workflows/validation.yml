name: Validation

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**', 'ci/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_ENV: test
  TRADING_MODE: PAPER
  DATABASE_URL: "ci://local-test"
  REDIS_URL: "redis://localhost:6379"
  SOLANA_RPC_URL: "https://api.mainnet-beta.solana.com"
  SOLANA_WS_URL: "wss://api.mainnet-beta.solana.com"
  DEXSCREENER_BASE_URL: "https://api.dexscreener.com"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --include=dev --ignore-scripts
      - name: Ensure pinned test runner is installed
        run: npm install --no-save --include=dev vitest@2.1.8
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
