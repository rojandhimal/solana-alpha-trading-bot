name: Repair dependency lockfile

on:
  push:
    branches: ['feature/walk-forward-integration']

permissions:
  contents: write

jobs:
  repair:
    if: \\!contains(github.event.head_commit.message, 'chore: repair dependency lockfile')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git add package-lock.json
          git commit -m "chore: repair dependency lockfile [skip ci]"
          git push
